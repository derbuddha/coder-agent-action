name: "Coder Agent on Issue"
description: >-
  Run a Coder Agent (Chats API) against a Gitea issue in a
  workspace built from one of your templates, then open a pull request.
author: "GITEA"

branding:
  icon: cpu
  color: blue

inputs:
  # --- Coder -----------------------------------------------------------------
  coder-url:
    description: "Base URL of the Coder deployment, e.g. https://coder.example.com"
    required: true
  coder-token:
    description: "Coder session token of a service account (Coder-Session-Token header)."
    required: true
  coder-organization:
    description: "Coder organization NAME or UUID. Names are resolved to a UUID."
    required: false
    default: "coder"
  coder-template-name:
    description: "Template NAME to build the workspace from, e.g. dockerUbuntuPython-agent."
    required: false
    default: ""
  coder-template-id:
    description: "Template UUID. Wins over coder-template-name if both are set."
    required: false
    default: ""
  coder-model:
    description: "Model name to pin, resolved against the organization's chat models (e.g. MiniMax-M3). Empty = deployment default."
    required: false
    default: ""
  coder-model-config-id:
    description: "model_config_id UUID. Wins over coder-model."
    required: false
    default: ""
  coder-chat-path:
    description: "UI route prefix for a chat, used to build the link posted on the issue."
    required: false
    default: "/agents/"
  workspace-name-prefix:
    description: "Prefix for the generated workspace name (lowercased, sanitised, truncated to 32 chars)."
    required: false
    default: "agent"
  git-repo-parameter:
    description: "Name of the template's rich parameter that receives the clone URL."
    required: false
    default: "git_repo_url"
  workspace-checkout-dir:
    description: "Directory inside the workspace where the template clones the repo."
    required: false
    default: "/home/coder/GIT"

  # --- Gitea -----------------------------------------------------------------
  gitea-url:
    description: "Gitea base URL. Defaults to the server URL of the current run."
    required: false
    default: ""
  gitea-token:
    description: >-
      Gitea token with repo + issue + PR scope. In Actions use
      secrets.GITEA_TOKEN (the automatic per-job token) — it is passed through
      as FORGE_TOKEN because Gitea forbids secrets named GITEA_*.
    required: true
  gitea-ssh-host:
    description: >-
      Override the SSH host the workspace clones from. Leave empty to use the
      repository's own ssh_url (from the event payload / API) — only set this
      when the host Gitea advertises isn't reachable from the Coder workspace.
    required: false
    default: ""
  gitea-ssh-port:
    description: "Override the SSH port. Leave empty to use the one in the repository's ssh_url."
    required: false
    default: ""
  repo-owner:
    description: "Repository owner. Defaults to the current repository."
    required: false
    default: ""
  repo-name:
    description: "Repository name. Defaults to the current repository."
    required: false
    default: ""
  issue-number:
    description: "Issue to work on. Defaults to the issue of the triggering event."
    required: false
    default: ""
  base-branch:
    description: "Base branch for the pull request."
    required: false
    default: "main"
  branch-prefix:
    description: "Work branch is <branch-prefix><issue-number>."
    required: false
    default: "ai/issue-"

  # --- behaviour -------------------------------------------------------------
  extra-prompt:
    description: "Extra instructions appended to the generated prompt (project conventions, test command, ...)."
    required: false
    default: ""
  skill-file:
    description: >-
      Repo path of a Markdown skill file with the agent's working rules, read
      from base-branch (then the work branch) over the Gitea API. Empty = the
      default skill shipped with this action (skills/default.md). A leading
      YAML frontmatter block is stripped. The pipeline steps (checkout,
      attachments, summary, finish script) are not part of the skill.
    required: false
    default: ""
  finish-script-path:
    description: "Path of the deterministic git wrapper inside the repository."
    required: false
    default: ".gitea/scripts/finish-issue.sh"
  summary-path:
    description: >-
      Path the agent writes its 5-sentence change summary to. The action reads
      this file from the branch after the agent pushes and pastes it into the
      PR description between "Automated by the Coder Agent." and "Closes #N".
      Empty = skip the summary lookup and omit the section.
    required: false
    default: ".gitea/agent-summary.md"
  bootstrap-finish-script:
    description: >-
      If the finish script is missing from the base branch, commit the copy
      shipped with this action to it before starting the agent.
    required: false
    default: "true"
  pr-template-path:
    description: >-
      Path (in the repo) of the PR template. Defaults to
      `.gitea/PULL_REQUEST_TEMPLATE.yaml`; the action ships a starter template
      at `templates/PULL_REQUEST_TEMPLATE.yaml` and bootstraps it onto the
      work branch when missing from $BASE_BRANCH (same pattern as
      `bootstrap-finish-script`). If the file is found, the action
      substitutes the agent's summary block (header + summary + Closes #N + links)
      into the `<!-- AI_SUMMARY -->` marker. Empty = use the built-in PR
      body (legacy behaviour).
    required: false
    default: ".gitea/PULL_REQUEST_TEMPLATE.yaml"
  pr-template-type:
    description: >-
      `markdown` (default) or `yaml`. Only affects documentation — both
      formats are treated as raw text and the marker below is tried in both
      cases. The action does NOT enforce required fields of a YAML form
      template: those are for human reviewers.
    required: false
    default: "yaml"
  comment-on-issue:
    description: "Post a start comment, a result comment, and a failure comment on the issue."
    required: false
    default: "true"
  include-attachments:
    description: >-
      Read the files uploaded to the issue and its comments and hand them to
      the agent. Text attachments are inlined into the prompt verbatim;
      binaries (images, PDFs, archives) and text over the caps below are
      committed to a temporary side branch the agent extracts outside its
      clone (see attachment-push-max-bytes). Set to `false` to skip the lookup
      entirely.
    required: false
    default: "true"
  attachment-max-bytes:
    description: "Per-file cap for an inlined attachment. Bigger files are listed, not inlined."
    required: false
    default: "65536"
  attachment-total-bytes:
    description: >-
      Total cap across all inlined attachments, so a pile of logs can't crowd
      the issue text out of the model's context window. Files are taken in
      order (issue first, then comments) until the budget is spent.
    required: false
    default: "262144"
  attachment-push-max-bytes:
    description: >-
      Per-file cap for an attachment that is not inlined but handed over as a
      file: it is committed to `<branch>-attachments`, which the agent fetches
      into attachment-workspace-dir, and that branch is deleted when the run
      ends. Bigger files are listed by name only. `0` turns the hand-over off.
    required: false
    default: "10485760"
  attachment-workspace-dir:
    description: >-
      Where the agent extracts the handed-over attachments inside the
      workspace. Keep it outside the clone, or they end up in the PR.
      Empty = /tmp/coder-agent-attachments/issue-<N>.
    required: false
    default: ""
  require-label:
    description: >-
      If set, the action exits early unless the issue currently carries this
      label — a second guard behind the workflow's own `if:`, worth setting
      because a mistaken run costs a Coder workspace. Empty by default, since
      wiring a second label to its own job is a supported pattern and a
      hardcoded name would make that job skip itself.
    required: false
    default: ""
  remove-label:
    description: >-
      Remove the trigger label from the issue after a run that opened a PR.
      Off by default: the removal is itself a label event, so Gitea starts (and
      then skips) a run of every label-triggered workflow for it. The label
      dropped is require-label, or failing that the one that triggered this run.
    required: false
    default: "false"
  stop-after:
    description: >-
      Workspace lifecycle after the run: 1h / 30m / 90s / 3600 = auto-stop that
      far in the future, now = stop immediately, off = leave running.
    required: false
    default: "1h"
  poll-timeout:
    description: "Seconds to wait for the agent to go running -> waiting. On timeout the chat is interrupted and the workspace stopped."
    required: false
    default: "3600"
  build-timeout:
    description: "Seconds to wait for the workspace build to reach running."
    required: false
    default: "900"
  fail-on-no-pr:
    description: "Fail the job when the run ends without a pull request."
    required: false
    default: "true"
  max-nudges:
    description: "Follow-up messages to post when the agent goes idle without pushing its branch (a model that ends its turn mid-task). 0 = off."
    required: false
    default: "3"

outputs:
  chat-id:
    description: "ID of the created agent chat."
    value: ${{ steps.agent.outputs.chat-id }}
  chat-url:
    description: "Link to the agent chat."
    value: ${{ steps.agent.outputs.chat-url }}
  workspace-id:
    description: "ID of the created workspace."
    value: ${{ steps.agent.outputs.workspace-id }}
  workspace-url:
    description: "Link to the workspace."
    value: ${{ steps.agent.outputs.workspace-url }}
  branch:
    description: "Branch the agent pushed."
    value: ${{ steps.agent.outputs.branch }}
  branch-url:
    description: "Link to the pushed branch (also set as the issue's Branch/Tag sidebar field)."
    value: ${{ steps.agent.outputs.branch-url }}
  nudges:
    description: "How many follow-up messages were posted to keep the agent going."
    value: ${{ steps.agent.outputs.nudges }}
  pr-url:
    description: "URL of the pull request, empty if none was created."
    value: ${{ steps.agent.outputs.pr-url }}
  result:
    description: "success | no-pr | failed | skipped (require-label missing)"
    value: ${{ steps.agent.outputs.result }}

runs:
  using: composite
  steps:
    - name: Ensure curl, jq, python3 + PyYAML
      shell: bash
      run: |
        need=""
        command -v curl    >/dev/null || need="$need curl"
        command -v jq      >/dev/null || need="$need jq"
        command -v python3 >/dev/null || need="$need python3"
        if [ -n "$need" ]; then
          if command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq $need
          elif command -v apk >/dev/null; then
            apk add --no-cache $need
          else
            echo "Missing:$need and no known package manager."; exit 1
          fi
        fi
        # PyYAML ships as a separate package on most distros — install it if
        # missing, so the YAML PR template renderer always works.
        if ! python3 -c 'import yaml' >/dev/null 2>&1; then
          if command -v apt-get >/dev/null; then
            apt-get install -y -qq python3-yaml
          elif command -v apk >/dev/null; then
            apk add --no-cache py3-yaml
          elif command -v pip3 >/dev/null; then
            pip3 install --quiet --break-system-packages pyyaml
          else
            echo "PyYAML is missing and no known package manager could install it."; exit 1
          fi
        fi

    - name: Run Coder Agent on the issue
      id: agent
      shell: bash
      env:
        CODER_URL:            ${{ inputs.coder-url }}
        CODER_SESSION_TOKEN:  ${{ inputs.coder-token }}
        CODER_ORG:            ${{ inputs.coder-organization }}
        AGENT_TEMPLATE:       ${{ inputs.coder-template-name }}
        AGENT_TEMPLATE_ID:    ${{ inputs.coder-template-id }}
        AGENT_MODEL:          ${{ inputs.coder-model }}
        MODEL_CONFIG_ID:      ${{ inputs.coder-model-config-id }}
        CODER_CHAT_PATH:      ${{ inputs.coder-chat-path }}
        WS_NAME_PREFIX:       ${{ inputs.workspace-name-prefix }}
        GIT_REPO_PARAM:       ${{ inputs.git-repo-parameter }}
        WS_CHECKOUT_DIR:      ${{ inputs.workspace-checkout-dir }}
        GITEA_URL:            ${{ inputs.gitea-url }}
        FORGE_TOKEN:          ${{ inputs.gitea-token }}
        GITEA_SSH_HOST:       ${{ inputs.gitea-ssh-host }}
        GITEA_SSH_PORT:       ${{ inputs.gitea-ssh-port }}
        REPO_OWNER:           ${{ inputs.repo-owner }}
        REPO_NAME:            ${{ inputs.repo-name }}
        ISSUE_NUM:            ${{ inputs.issue-number }}
        BASE_BRANCH:          ${{ inputs.base-branch }}
        BRANCH_PREFIX:        ${{ inputs.branch-prefix }}
        EXTRA_PROMPT:         ${{ inputs.extra-prompt }}
        SKILL_FILE:           ${{ inputs.skill-file }}
        FINISH_SCRIPT_PATH:   ${{ inputs.finish-script-path }}
        SUMMARY_PATH:         ${{ inputs.summary-path }}
        BOOTSTRAP_FINISH:     ${{ inputs.bootstrap-finish-script }}
        PR_TEMPLATE_PATH:     ${{ inputs.pr-template-path }}
        PR_TEMPLATE_TYPE:     ${{ inputs.pr-template-type }}
        COMMENT_ON_ISSUE:     ${{ inputs.comment-on-issue }}
        INCLUDE_ATTACHMENTS:  ${{ inputs.include-attachments }}
        ATTACHMENT_MAX_BYTES: ${{ inputs.attachment-max-bytes }}
        ATTACHMENT_TOTAL_BYTES: ${{ inputs.attachment-total-bytes }}
        ATTACHMENT_PUSH_MAX_BYTES: ${{ inputs.attachment-push-max-bytes }}
        WS_ATTACHMENT_DIR:    ${{ inputs.attachment-workspace-dir }}
        REQUIRE_LABEL:        ${{ inputs.require-label }}
        REMOVE_LABEL:         ${{ inputs.remove-label }}
        STOP_AFTER:           ${{ inputs.stop-after }}
        POLL_TIMEOUT:         ${{ inputs.poll-timeout }}
        BUILD_TIMEOUT:        ${{ inputs.build-timeout }}
        FAIL_ON_NO_PR:        ${{ inputs.fail-on-no-pr }}
        MAX_NUDGES:           ${{ inputs.max-nudges }}
        ACTION_PATH:          ${{ github.action_path }}
      run: bash "${{ github.action_path }}/coder-agent-issue.sh"