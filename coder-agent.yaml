name: Coder Agent on Issue
# .gitea/workflows/coder-agent.yaml — drop this into any repo that should get
# an agent when an issue is labelled.
#
# run-name overrides the run title so it shows the ISSUE instead of main's
# latest commit message. (If your Gitea version ignores run-name — see
# go-gitea/gitea#34247 — the commit message will still show; that's the bug,
# not this config.)
#
# The action repo is fetched, not `uses:`-ed. `uses: <url>/coder-agent-action`
# only works on a repo the runner can read anonymously: Gitea resolves `uses:`
# before the job starts and cannot take a token — an open upstream limitation
# (go-gitea/gitea#26032, #27935), not something a syntax change fixes. So we
# fetch the action with an action: actions/checkout can clone ANY repo on this
# instance when given `repository` + `token`, and then call it by local path.
#
# Token: the automatic per-job token is minted for THIS repository and will be
# refused on the action repo, so ACTION_CLONE_TOKEN carries the fetch and the
# job token is only a fallback for the day the action repo goes public.
#
# ACTION_CLONE_TOKEN:
#   a PAT with read:repository scope, from an account that can see the action
#   repo. Set it ONCE on the org so every repo inherits it.
#   Gitea rejects secret names starting with GITEA_ or GITHUB_.
#
# MM_WEBHOOK_URL:
#   Mattermost incoming webhook. Set on the org too, as secret (preferred)
#   or variable; the secret wins if both exist. Without it the notify
#   steps simply post nothing (the action soft-fails by design).

run-name: "Coder Agent · issue #${{ gitea.event.issue.number }} — ${{ gitea.event.issue.title }}"

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # One job per label: to wire a second label to another template or model,
  # copy this job, change the label in `if:` and point coder-template-name at
  # its own variable (e.g. vars.AGENT_TEMPLATE_CLAUDE).
  agent:
    runs-on: ubuntu-24.04
    # Gitea maps `labeled` to action `label_updated`; the added label's name is
    # in changes.added_labels[0] (empty on unrelated events, so they skip).
    if: ${{ gitea.event.action == 'label_updated' && gitea.event.changes.added_labels[0].name == 'coder-agent' }}
    steps:
      - name: Fetch the action
        # Absolute URL on purpose: it pins the fetch to your own mirror of
        # actions/checkout (pull-mirrored from GitHub) regardless of the
        # instance's [actions] DEFAULT_ACTIONS_URL. A bare `actions/checkout@v4`
        # resolves to github.com unless that is set to `self` — an internet call
        # you may not want. (No local mirror? The README does the same fetch as
        # a plain git-clone script.)
        uses: https://gitea.example.com/actions/checkout@v4
        with:
          repository: gitea/coder-agent-action
          ref: main
          # PAT first; the per-job token only works if the repo becomes public.
          token: ${{ secrets.ACTION_CLONE_TOKEN || secrets.GITEA_TOKEN }}
          path: .action
          # Don't leave the PAT in .action/.git/config for the agent to find.
          persist-credentials: false
          # Only if the runner's GITHUB_SERVER_URL is wrong (e.g. Gitea behind
          # a subpath — go-gitea/gitea#33629):
          # github-server-url: https://gitea.example.com

      - name: Fetch the notify action
        uses: https://gitea.example.com/actions/checkout@v4
        with:
          repository: gitea/notify-workflow-action
          ref: main
          token: ${{ secrets.ACTION_CLONE_TOKEN || secrets.GITEA_TOKEN }}
          path: .actions/notify-workflow-action
          persist-credentials: false

      - name: Notify start
        uses: ./.actions/notify-workflow-action
        with:
          webhook_url: ${{ secrets.MM_WEBHOOK_URL || vars.MM_WEBHOOK_URL }}
          status: info
          title: "Coder Agent gestartet · ${{ gitea.repository }} #${{ gitea.event.issue.number }}"
          text: ${{ gitea.event.issue.title }}
          link: ${{ gitea.event.issue.html_url }}
          no_proxy: ${{ vars.INTERNAL_NO_PROXY }}

      # Called by local path: `uses:` cannot fetch the private action repo
      # itself (see above), but a path that already exists in the workspace is
      # resolved without any network call. This is what buys us the action's
      # outputs — pr-url below — which the previous `run: bash ...` form could
      # not expose.
      - name: Run Coder Agent on this issue
        id: agent
        uses: ./.action
        with:
          coder-url:            ${{ vars.CODER_URL }}
          coder-token:          ${{ secrets.CODER_TOKEN }}
          coder-organization:   ${{ vars.CODER_ORG_ID }}
          # Template name comes from the repo (or org) variable, so switching
          # templates is a settings change, not a commit.
          coder-template-name:  ${{ vars.AGENT_TEMPLATE }}
          # Optional: pin a model by name (empty = deployment default).
          coder-model:          ${{ vars.AGENT_MODEL }}
          gitea-token:          ${{ secrets.GITEA_TOKEN }}   # automatic per-job token
          # Optional repo path of a custom skill file; empty = skills/default.md.
          skill-file:           ${{ vars.AGENT_SKILL_FILE }}
          stop-after:           "1h"                         # keep the workspace for debugging
          # The PR body always carries `Closes #<issue>`, so merging the PR
          # closes the issue — Gitea does that itself, no extra permission.
          # The clone URL comes from the repo's own ssh_url. Only set these if
          # the clone inside the workspace fails — the log prints the URL it
          # used just before creating the workspace:
          # gitea-ssh-host:     git-ssh.example.com
          # gitea-ssh-port:     "2222"

      # always(): this must also run when the agent step failed — that is the
      # message you actually want. job.status carries success/failure through.
      - name: Notify result
        if: always()
        uses: ./.actions/notify-workflow-action
        with:
          webhook_url: ${{ secrets.MM_WEBHOOK_URL || vars.MM_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Coder Agent ${{ job.status }} · ${{ gitea.repository }} #${{ gitea.event.issue.number }}"
          text: ${{ gitea.event.issue.title }}
          # Falls back to the issue when no PR was opened (failure, or no-pr).
          link: ${{ steps.agent.outputs.pr-url || gitea.event.issue.html_url }}
          fields: >-
            [{"title":"Ergebnis","value":"${{ steps.agent.outputs.result || 'abgebrochen' }}","short":true},
             {"title":"Branch","value":"${{ steps.agent.outputs.branch || '—' }}","short":true}]
          footer: "Chat: ${{ steps.agent.outputs.chat-url }}"
          no_proxy: ${{ vars.INTERNAL_NO_PROXY }}
