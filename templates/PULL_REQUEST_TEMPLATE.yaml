name: Pull Request
about: Standard PR with AI summary
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below — the agent fills in the AI summary.
    visible: [form]

  - type: checkboxes
    id: change-type
    attributes:
      label: Type
      description: Kind of change — tick all that apply
      options:
        - label: Bug
        - label: Feature
        - label: Refactor / Chore
        - label: AI Agent

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line summary of what you changed and why. (Minimum 20 characters.)
      placeholder: e.g. rewrote the retry logic and dropped an unused helper.
    validations:
      required: true
      # Go regexp. "." matches one rune, so umlauts count as one character.
      regex: "^.{20,}$"

  - type: textarea
    id: detailed-changes
    attributes:
      label: Detail Changes
      description: Bullet list of what you changed and why.
      placeholder: |
        - Rewrote the retry logic to handle network timeouts
        - Renamed `foo` to `bar` for clarity
        - Removed `unusedHelper()` — no caller referenced it
      value: "- "
    validations:
      required: true

  - type: textarea
    id: ai-summary
    attributes:
      label: AI - Summary
      description: Brief description of the change, its motivation, and impact — written by the AI agent.
      placeholder: Filled in by the agent.
      # Marker the Coder Agent action looks for to substitute its summary
      # block (header + summary + Closes #N + links). Leave it in place.
      value: |
        <!-- AI_SUMMARY -->
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Tests pass locally
          required: true
        - label: Documentation updated
        - label: Human review done
          visible: [content]